spring.application.name=permissions
server.port=${PORT:8081}

# PostgreSQL Datasource
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/permissions_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Users provider for GET /users: auth0 | none (default none -> empty list)
users.provider=${USERS_PROVIDER:none}
auth0.domain=${AUTH0_DOMAIN:}
auth0.mgmt.client-id=${AUTH0_MGMT_CLIENT_ID:}
auth0.mgmt.client-secret=${AUTH0_MGMT_CLIENT_SECRET:}
